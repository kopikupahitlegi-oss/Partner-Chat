name: Build Partner Bank APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses & install API 36.1
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK root: ${SDK_ROOT}"

          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          fi

          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            echo "Found sdkmanager: ${SDK_MANAGER}"
            yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || true
          else
            echo "sdkmanager not found under ${SDK_ROOT}; relying on AGP auto-download"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle & Java environment
        run: |
          which gradle
          gradle --version

      - name: Prepare signing keystore & environment
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            if tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore && \
               keytool -list -keystore debug.keystore -storepass android > /dev/null 2>&1; then
              echo "Decoded valid debug.keystore from debug.keystore.base64"
            else
              rm -f debug.keystore
            fi
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build signed APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"
        run: gradle :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Prepare versioned APK file
        id: apk
        run: |
          TAG_NAME="v1.0-build-${GITHUB_RUN_NUMBER}"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            TAG_NAME="${TAG_NAME}-r${GITHUB_RUN_ATTEMPT}"
          fi
          APK_NAME="PartnerBank-${TAG_NAME}.apk"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          APK_SIZE=$(du -h "dist/${APK_NAME}" | cut -f1)
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish Direct APK Download via GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.apk.outputs.tag_name }}"
          APK_PATH="${{ steps.apk.outputs.apk_path }}"
          APK_NAME="${{ steps.apk.outputs.apk_name }}"
          COMMIT_MSG=$(git log -1 --pretty=%s || echo "Update Partner Bank")

          printf "Build otomatis untuk **Partner Bank** (%s).\n\n**Perubahan terakhir:** %s\n\nKlik file **\`%s\`** di bagian **Assets** di bawah untuk langsung mengunduh dan menginstal APK di HP Android Anda.\n" \
            "$TAG_NAME" "$COMMIT_MSG" "$APK_NAME" > dist/release-notes.md

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
            RELEASE_OK=true
          elif gh release create "$TAG_NAME" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "Partner Bank ${TAG_NAME}" \
            --notes-file dist/release-notes.md \
            --latest; then
            RELEASE_OK=true
          else
            RELEASE_OK=false
          fi

          if [ "$RELEASE_OK" = "true" ]; then
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "### Partner Bank APK Siap Diunduh" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **File:** \`${APK_NAME}\` (${{ steps.apk.outputs.apk_size }})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Unduh Langsung (.apk):** [${APK_NAME}](${DIRECT_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Halaman Release:** [Buka Release ${TAG_NAME}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Partner Bank APK Berhasil Dibuild (Tersedia di Artifacts)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **File:** \`${APK_NAME}\` (${{ steps.apk.outputs.apk_size }}) sudah tersedia di bagian **Artifacts** di bawah." >> "$GITHUB_STEP_SUMMARY"
            echo "- Untuk mengaktifkan link unduh langsung di **Releases**, buka **Settings > Actions > General > Workflow permissions** lalu pilih **Read and write permissions**." >> "$GITHUB_STEP_SUMMARY"
          fi
